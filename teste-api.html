<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste API</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;padding:16px;max-width:600px;margin:auto}
input,button,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #444;background:#222;color:#eee;font-size:15px;box-sizing:border-box}
button{background:#6d28d9;border:0;font-weight:bold}
pre{background:#000;padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<h3>Teste OpenRouter</h3>
<input id="key" value="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">
<button onclick="listar()">1. Listar modelos grátis</button>
<select id="modelo"><option>cognitivecomputations/dolphin-mistral-24b-venice-edition:free</option></select>
<input id="msg" value="Diga oi em uma frase.">
<button onclick="testar()">2. Testar</button>
<pre id="out">Aguardando...</pre>
<script>
const out=document.getElementById('out');
async function listar(){
  out.textContent='Buscando...';
  try{
    const r=await fetch('https://openrouter.ai/api/v1/models');
    const d=await r.json();
    const free=d.data.filter(m=>m.id.endsWith(':free'));
    const s=document.getElementById('modelo');
    s.innerHTML=free.map(m=>`<option>${m.id}</option>`).join('');
    out.textContent=free.length+' modelos grátis carregados.';
  }catch(e){out.textContent='Erro: '+e.message}
}
async function testar(){
  out.textContent='Testando...';
  try{
    const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
      method:'POST',
      headers:{'Authorization':'Bearer '+document.getElementById('key').value.trim(),'Content-Type':'application/json'},
      body:JSON.stringify({model:document.getElementById('modelo').value,messages:[{role:'user',content:document.getElementById('msg').value}]})
    });
    const d=await r.json();
    out.textContent=r.ok?'✅ FUNCIONOU\n\n'+d.choices[0].message.content:'❌ ERRO '+r.status+'\n\n'+JSON.stringify(d,null,2);
  }catch(e){out.textContent='Erro: '+e.message}
}
</script>
</body>
</html>
